{% extends "base.html" %}

{% block title %}Static Map{% endblock %}

{% block content %}
<style>
  /* Ensure navbar has proper spacing and size - use highest specificity */
  body nav.navbar.navbar-expand-lg.navbar-dark.bg-dark {
    margin-bottom: 1.5rem !important;
    min-height: 56px !important;
    padding-top: 0.5rem !important;
    padding-bottom: 0.5rem !important;
  }
  
  /* Prevent any global styles from affecting navbar */
  nav.navbar {
    margin-bottom: 1.5rem !important;
  }
  
  /* Ensure navbar brand and items have proper sizing */
  .navbar-brand {
    font-size: 1.25rem !important;
    padding-top: 0.3125rem !important;
    padding-bottom: 0.3125rem !important;
  }
  
  /* Mobile-specific fixes for map visibility */
  @media (max-width: 768px) {
    main.container {
      padding-left: 0 !important;
      padding-right: 0 !important;
      max-width: 100% !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
    }
    .navbar {
      margin-bottom: 1rem !important;
    }
    #map-container {
      height: calc(100vh - 180px) !important;
      min-height: 300px !important;
      border-radius: 0 !important;
      margin-left: -15px;
      margin-right: -15px;
      width: calc(100% + 30px);
      position: relative !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      z-index: 1 !important;
    }
    .row.mb-3 {
      margin-left: 0 !important;
      margin-right: 0 !important;
    }
    .card {
      margin-left: 0 !important;
      margin-right: 0 !important;
    }
    /* Ensure Leaflet container is visible */
    .leaflet-container {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      height: 100% !important;
      width: 100% !important;
    }
  }
  /* Map container styling */
  #map-container {
    position: relative;
    height: 70vh;
    min-height: 400px;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 1rem;
  }
  
  /* Ensure Folium map divs are visible */
  #map-container .leaflet-container {
    height: 100% !important;
    width: 100% !important;
  }
  
  #map-container div[id*="map"] {
    height: 100% !important;
    width: 100% !important;
  }
</style>

<div class="row mb-3">
  <div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <div class="tips-ui" style="font-size: 12px; color: #6c757d; padding: 8px; background-color: #f8f9fa; border-radius: 4px;">
          <strong>Static Map View:</strong> This map shows all locations from the database. Use the layer controls to toggle different location types. For search functionality, visit the <a href="/interactive-map">Interactive Map</a>.
        </div>
      </div>
    </div>
  </div>
</div>

<div
  id="map-container"
  style="position: relative; height: 70vh; min-height: 400px; border-radius: 8px; overflow: hidden;"
>
  {{ map_html|safe }}
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Interactive Map{% endblock %}

{% block content %}
<div class="row mb-3">
  <div class="col-md-10">
    <div class="card">
      <div class="card-body d-flex flex-wrap gap-2 align-items-center">
        <input
          id="search-term"
          class="form-control me-2"
          placeholder="Location name or postcode"
          style="max-width: 280px;"
        />
        <input
          id="search-radius"
          class="form-control me-2"
          type="number"
          value="10"
          min="1"
          max="100"
          style="max-width: 120px;"
        />
        <button id="search-btn" class="btn btn-primary me-2">
          Search
        </button>
        <button id="clear-btn" class="btn btn-outline-secondary me-2">
          Clear
        </button>
        <span id="search-status" class="text-muted small"></span>
      </div>
    </div>
  </div>
</div>

<div
  id="map-container"
  style="position: relative; height: 70vh; border-radius: 8px; overflow: hidden;"
>
  <div id="map" style="height: 100%;"></div>

  <!-- Legend copied from static map styling for consistent UX -->
  <div
    id="map-legend"
    style="
      position: absolute;
      right: 12px;
      bottom: 20px;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #999;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      min-width: 230px;
    "
  >
    <div style="font-weight: 600; margin-bottom: 6px">Legend</div>
    <div style="line-height: 1.4; margin-bottom: 4px">
      <div>
        <i class="fa fa-wrench" style="color: blue"></i>&nbsp; Toyota Service
        Outlets
      </div>
      <div>
        <i class="fa fa-car" style="color: green"></i>&nbsp; Toyota Body &amp;
        Paint
      </div>
      <div>
        <i class="fa fa-road" style="color: red"></i>&nbsp; Traffic Police
        Stations
      </div>
    </div>
    <hr style="margin: 8px 0" />
    <div style="font-weight: 600; margin-bottom: 4px">Customer Density</div>
    <div style="line-height: 1.4">
      <div style="display: flex; align-items: center; margin: 2px 0">
        <span
          style="
            display: inline-block;
            width: 18px;
            height: 12px;
            background: #2b83ba;
            border: 1px solid #666;
            margin-right: 8px;
          "
        ></span>
        <span style="font-size: 12px">Low</span>
      </div>
      <div style="display: flex; align-items: center; margin: 2px 0">
        <span
          style="
            display: inline-block;
            width: 18px;
            height: 12px;
            background: #80bfab;
            border: 1px solid #666;
            margin-right: 8px;
          "
        ></span>
        <span style="font-size: 12px">Med-Low</span>
      </div>
      <div style="display: flex; align-items: center; margin: 2px 0">
        <span
          style="
            display: inline-block;
            width: 18px;
            height: 12px;
            background: #ffffbf;
            border: 1px solid #666;
            margin-right: 8px;
          "
        ></span>
        <span style="font-size: 12px">Medium</span>
      </div>
      <div style="display: flex; align-items: center; margin: 2px 0">
        <span
          style="
            display: inline-block;
            width: 18px;
            height: 12px;
            background: #fdae61;
            border: 1px solid #666;
            margin-right: 8px;
          "
        ></span>
        <span style="font-size: 12px">Med-High</span>
      </div>
      <div style="display: flex; align-items: center; margin: 2px 0">
        <span
          style="
            display: inline-block;
            width: 18px;
            height: 12px;
            background: #d7191c;
            border: 1px solid #666;
            margin-right: 8px;
          "
        ></span>
        <span style="font-size: 12px">High</span>
      </div>
    </div>
  </div>
</div>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
  crossorigin="anonymous"
/>
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>
<script>
  const map = L.map("map").setView([4.5, 109.0], 6);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors",
  }).addTo(map);

  const customersLayer = L.layerGroup().addTo(map);
  const serviceLayer = L.layerGroup().addTo(map);
  const bpLayer = L.layerGroup().addTo(map);
  const trafficLayer = L.layerGroup().addTo(map);
  const borderLayer = L.layerGroup().addTo(map);

  const customerStyle = {
    radius: 7,
    color: "#e67e22",
    fillColor: "#e67e22",
    fillOpacity: 0.9,
  };
  const serviceStyle = {
    radius: 7,
    color: "blue",
    fillColor: "blue",
    fillOpacity: 0.9,
  };
  const bpStyle = {
    radius: 7,
    color: "green",
    fillColor: "green",
    fillOpacity: 0.9,
  };
  const trafficStyle = {
    radius: 7,
    color: "red",
    fillColor: "red",
    fillOpacity: 0.9,
  };

  L.control
    .layers(null, {
      Customers: customersLayer,
      "Toyota Service Outlets": serviceLayer,
      "Toyota Body & Paint": bpLayer,
      "Traffic Police Stations": trafficLayer,
    })
    .addTo(map);

  async function runSearch() {
    const termInput = document.getElementById("search-term");
    const radiusInput = document.getElementById("search-radius");
    const statusEl = document.getElementById("search-status");

    const term = termInput.value.trim();
    const radius = parseFloat(radiusInput.value);

    if (!term) {
      statusEl.textContent = "Please enter a location or postcode.";
      return;
    }
    if (!radius || radius <= 0) {
      statusEl.textContent = "Radius must be a positive number.";
      return;
    }

    statusEl.textContent = "Searching...";

    try {
      const url = `/api/search?term=${encodeURIComponent(
        term
      )}&radius_km=${encodeURIComponent(radius)}`;
      const resp = await fetch(url);

      if (!resp.ok) {
        let detail = "No results found.";
        try {
          const data = await resp.json();
          if (data && data.detail) {
            detail = data.detail;
          }
        } catch (e) {}
        statusEl.textContent = detail;
        return;
      }

      const data = await resp.json();

      customersLayer.clearLayers();
      serviceLayer.clearLayers();
      bpLayer.clearLayers();
      trafficLayer.clearLayers();
      borderLayer.clearLayers();

      const bounds = [];

      function addMarkers(items, layer, style) {
        items.forEach((item) => {
          const latlng = [item.lat, item.lon];
          bounds.push(latlng);

          const marker = L.circleMarker(latlng, style || {});
          const props = { ...item };
          delete props.lat;
          delete props.lon;

          let popup = `<strong>${item.label}</strong>`;
          const lines = [];
          for (const [k, v] of Object.entries(props)) {
            if (k === "label") continue;
            lines.push(`<b>${k}</b>: ${v}`);
          }
          if (lines.length) {
            popup += "<br>" + lines.join("<br>");
          }
          marker.bindPopup(popup);
          marker.addTo(layer);
        });
      }

      addMarkers(data.customers || [], customersLayer, customerStyle);
      addMarkers(data.service || [], serviceLayer, serviceStyle);
      addMarkers(data.bp || [], bpLayer, bpStyle);
      addMarkers(data.traffic || [], trafficLayer, trafficStyle);

      const circle = L.circle([data.center.lat, data.center.lon], {
        radius: data.radius_km * 1000,
        color: "red",
        weight: 2,
        fill: false,
      }).addTo(borderLayer);

      const circleBounds = circle.getBounds();
      bounds.push(circleBounds.getNorthEast());
      bounds.push(circleBounds.getSouthWest());

      if (bounds.length) {
        map.fitBounds(bounds, { padding: [20, 20] });
      }

      statusEl.textContent = `Showing results within ${
        data.radius_km
      } km of "${term}".`;
    } catch (err) {
      console.error(err);
      statusEl.textContent = "Error contacting server.";
    }
  }

  document
    .getElementById("search-btn")
    .addEventListener("click", () => runSearch());

  document
    .getElementById("clear-btn")
    .addEventListener("click", () => {
      const termInput = document.getElementById("search-term");
      const radiusInput = document.getElementById("search-radius");
      const statusEl = document.getElementById("search-status");

      termInput.value = "";
      radiusInput.value = "10";
      statusEl.textContent = "";

      customersLayer.clearLayers();
      serviceLayer.clearLayers();
      bpLayer.clearLayers();
      trafficLayer.clearLayers();
      borderLayer.clearLayers();

      map.setView([4.5, 109.0], 6);
    });

  document
    .getElementById("search-term")
    .addEventListener("keyup", (e) => {
      if (e.key === "Enter") {
        runSearch();
      }
    });
</script>
{% endblock %}

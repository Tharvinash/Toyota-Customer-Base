{% extends "base.html" %} {% block title %}Interactive Map{% endblock %} {%
block content %}
<style>
  /* Ensure navbar has proper spacing */
  .navbar {
    margin-bottom: 1.5rem !important;
  }

  /* Mobile-specific fixes for map visibility */
  @media (max-width: 768px) {
    main.container {
      padding-left: 0 !important;
      padding-right: 0 !important;
      max-width: 100% !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
    }
    .navbar {
      margin-bottom: 1rem !important;
    }
    #map-container {
      height: calc(100vh - 180px) !important;
      min-height: 300px !important;
      border-radius: 0 !important;
      margin-left: -15px;
      margin-right: -15px;
      width: calc(100% + 30px);
      position: relative !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      z-index: 1 !important;
    }
    #map {
      position: relative !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      height: 100% !important;
      width: 100% !important;
    }
    .row.mb-3 {
      margin-left: 0 !important;
      margin-right: 0 !important;
    }
    .card {
      margin-left: 0 !important;
      margin-right: 0 !important;
    }
    /* Ensure Leaflet container is visible */
    .leaflet-container {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      height: 100% !important;
      width: 100% !important;
    }
  }
</style>

<div class="row mb-3">
  <div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
          <select
            id="search-type"
            class="form-select me-2"
            style="max-width: 150px"
          >
            <option value="state">State</option>
            <option value="area" selected>Area/Township</option>
            <option value="postcode">Postcode</option>
          </select>
          <input
            id="search-term"
            class="form-control me-2"
            placeholder="Enter state, area, or postcode"
            style="max-width: 400px"
          />
          <div id="radius-container" class="me-2">
            <input
              id="search-radius"
              class="form-control"
              type="number"
              value="10"
              min="1"
              max="100"
              style="max-width: 120px"
              placeholder="Radius (km)"
            />
          </div>
          <button id="search-btn" class="btn btn-primary me-2">Search</button>
          <button id="clear-btn" class="btn btn-outline-secondary me-2">
            Clear
          </button>
          <span id="search-status" class="text-muted small"></span>
        </div>
        <div
          class="tips-ui"
          style="
            font-size: 12px;
            color: #6c757d;
            padding: 8px;
            background-color: #f8f9fa;
            border-radius: 4px;
            margin-top: 8px;
          "
        >
          <strong>Tips:</strong>
          <span id="search-tips"
            >Enter comma-separated values (e.g.,
            <code>Selangor, Kuala Lumpur</code> or
            <code>40400, 47300</code>).</span
          >
        </div>
      </div>
    </div>
  </div>
</div>

<div
  id="map-container"
  style="
    position: relative;
    height: 70vh;
    min-height: 400px;
    border-radius: 8px;
    overflow: hidden;
  "
>
  <div id="map" style="height: 100%; width: 100%"></div>

  <!-- Legend copied from static map styling for consistent UX -->
  <div
    id="map-legend"
    style="
      position: absolute;
      right: 12px;
      bottom: 20px;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #999;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      min-width: 230px;
      max-width: calc(100% - 24px);
      pointer-events: auto;
    "
  >
    <div style="font-weight: 600; margin-bottom: 6px">Legend</div>
    <div style="line-height: 1.4; margin-bottom: 4px">
      <div>
        <i class="fa fa-wrench" style="color: blue"></i>&nbsp; Toyota Service
        Outlets
      </div>
      <div>
        <i class="fa fa-car" style="color: green"></i>&nbsp; Toyota Body &amp;
        Paint
      </div>
      <div>
        <i class="fa fa-road" style="color: red"></i>&nbsp; Traffic Police
        Stations
      </div>
    </div>
    <hr style="margin: 8px 0" />
    <div style="font-weight: 600; margin-bottom: 4px">Customer Density</div>
    <div id="density-legend-ranges" style="line-height: 1.4"></div>
  </div>
</div>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"

/>
<style>
  /* Mobile responsive fixes for interactive map */
  @media (max-width: 768px) {
    #map-container {
      height: calc(100vh - 180px) !important;
      min-height: 300px !important;
    }
    #map-legend {
      font-size: 11px !important;
      padding: 8px 10px !important;
      min-width: 180px !important;
      right: 8px !important;
      bottom: 10px !important;
    }
    #map-legend span {
      font-size: 11px !important;
    }
    .card-body {
      padding: 0.75rem !important;
    }
    .form-control {
      font-size: 14px !important;
    }
    .btn {
      font-size: 14px !important;
      padding: 0.375rem 0.75rem !important;
    }
    /* Ensure map is visible and not hidden */
    #map {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
    }
  }
  /* Ensure Leaflet works on mobile */
  .leaflet-container {
    touch-action: pan-x pan-y;
    -webkit-tap-highlight-color: transparent;
  }
</style>
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
  // Declare map variable globally
  let map;
  let heatmapLayer;
  let customersLayer,
    customerCirclesLayer,
    serviceLayer,
    bpLayer,
    trafficLayer,
    boundaryLayer;
  let layerControl;

  // Define marker styles globally so they're accessible everywhere
  const customerStyle = {
    radius: 7,
    color: "#e67e22",
    fillColor: "#e67e22",
    fillOpacity: 0.9,
  };
  const serviceStyle = {
    radius: 7,
    color: "blue",
    fillColor: "blue",
    fillOpacity: 0.9,
  };
  const bpStyle = {
    radius: 7,
    color: "green",
    fillColor: "green",
    fillOpacity: 0.9,
  };
  const trafficStyle = {
    radius: 7,
    color: "red",
    fillColor: "red",
    fillOpacity: 0.9,
  };
  const boundaryColors = [
    "#ff4d4f",
    "#1890ff",
    "#52c41a",
    "#fa8c16",
    "#13c2c2",
    "#eb2f96",
    "#722ed1",
    "#a0d911",
    "#fa541c",
    "#2f54eb",
  ];
  const densityBuckets = [
    { max: 1000, label: "< 1,000", color: "#2b83ba" },
    { min: 1001, max: 2000, label: "1,001 – 2,000", color: "#80bfab" },
    { min: 2001, max: 3000, label: "2,001 – 3,000", color: "#ffffbf" },
    { min: 3001, max: 4000, label: "3,001 – 4,000", color: "#fdae61" },
    { min: 4001, max: 5000, label: "4,001 – 5,000", color: "#f46d43" },
    { min: 5001, label: "> 5,000", color: "#d7191c" },
  ];
  const MALAYSIAN_STATE_LOOKUP = {
    johor: "Johor",
    kedah: "Kedah",
    kelantan: "Kelantan",
    melaka: "Melaka",
    malacca: "Melaka",
    "negeri sembilan": "Negeri Sembilan",
    pahang: "Pahang",
    penang: "Pulau Pinang",
    "pulau pinang": "Pulau Pinang",
    perak: "Perak",
    perlis: "Perlis",
    sabah: "Sabah",
    sarawak: "Sarawak",
    selangor: "Selangor",
    terengganu: "Terengganu",
    "kuala lumpur": "Kuala Lumpur",
    "wilayah persekutuan kuala lumpur": "Kuala Lumpur",
    "wp kuala lumpur": "Kuala Lumpur",
    labuan: "Labuan",
    "wilayah persekutuan labuan": "Labuan",
    "wp labuan": "Labuan",
    putrajaya: "Putrajaya",
    "wilayah persekutuan putrajaya": "Putrajaya",
    "wp putrajaya": "Putrajaya",
  };

  const MAX_SEARCH_TERMS = 10;

  function normalizeStateInput(value) {
    return value
      .trim()
      .toLowerCase()
      .replace(/, malaysia$/i, "")
      .replace(/\./g, " ")
      .replace(/-/g, " ")
      .replace(/\s+/g, " ");
  }

  function isValidStateInput(value) {
    const key = normalizeStateInput(value);
    return Boolean(MALAYSIAN_STATE_LOOKUP[key]);
  }

  function getBoundaryColor(index) {
    return boundaryColors[index % boundaryColors.length];
  }

  function renderDensityLegend() {
    const legendContainer = document.getElementById("density-legend-ranges");
    if (!legendContainer) return;
    legendContainer.innerHTML = densityBuckets
      .map(
        (bucket) => `
        <div style="display:flex;align-items:center;margin:2px 0;">
          <span style="
            display:inline-block;
            width:18px;
            height:12px;
            border:1px solid #666;
            margin-right:8px;
            background:${bucket.color};
          "></span>
          <span style="font-size:12px;">${bucket.label}</span>
        </div>
      `
      )
      .join("");
  }

  // Wait for DOM to be fully loaded before initializing map
  document.addEventListener("DOMContentLoaded", function () {
    renderDensityLegend();
    // Ensure map container is visible
    const mapContainer = document.getElementById("map-container");
    const mapDiv = document.getElementById("map");
    if (mapContainer && mapDiv) {
      mapContainer.style.display = "block";
      mapDiv.style.display = "block";
      mapDiv.style.visibility = "visible";
      mapDiv.style.opacity = "1";
    }

    // Malaysia bounds: [south_lat, west_lon], [north_lat, east_lon]
    const malaysiaBounds = L.latLngBounds(
      [0.85, 99.5], // Southwest corner
      [7.5, 119.5] // Northeast corner
    );

    // Initialize map with mobile-friendly settings and restrict to Malaysia
    map = L.map("map", {
      touchZoom: true,
      doubleClickZoom: true,
      boxZoom: true,
      keyboard: true,
      scrollWheelZoom: true,
      dragging: true,
      tap: true,
      maxBounds: malaysiaBounds,
      maxBoundsViscosity: 1.0, // Prevents panning outside bounds
    }).setView([4.5, 109.0], 6);

    // Ensure initial view is within Malaysia bounds
    if (!malaysiaBounds.contains(map.getCenter())) {
      map.setView([4.5, 109.0], 6);
    }

    // Force map to resize on mobile after initialization
    setTimeout(() => {
      map.invalidateSize();
      // Double-check visibility
      if (mapContainer) {
        mapContainer.style.display = "block";
        mapContainer.style.visibility = "visible";
      }
    }, 100);

    // Additional resize after a short delay for mobile
    setTimeout(() => {
      map.invalidateSize();
    }, 500);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    // Initialize layers
    heatmapLayer = null; // Will be created when data is available
    customersLayer = L.layerGroup().addTo(map);
    customerCirclesLayer = L.layerGroup().addTo(map);
    serviceLayer = L.layerGroup().addTo(map);
    bpLayer = L.layerGroup().addTo(map);
    trafficLayer = L.layerGroup().addTo(map);
    boundaryLayer = L.layerGroup().addTo(map);

    // Create layer control with all layers
    const baseLayers = {};
    const overlayLayers = {
      "Customer Density (Heatmap)": customersLayer,
      "Customer Density (Circles)": customerCirclesLayer,
      "Toyota Service Outlets": serviceLayer,
      "Toyota Body & Paint": bpLayer,
      "Traffic Police Stations": trafficLayer,
      "Search Boundary": boundaryLayer,
    };

    layerControl = L.control
      .layers(baseLayers, overlayLayers, {
        collapsed: false,
        position: "topleft",
      })
      .addTo(map);

    // Show/hide radius input based on search type
    const searchTypeSelect = document.getElementById("search-type");
    const radiusContainer = document.getElementById("radius-container");
    const searchTips = document.getElementById("search-tips");

    function updateSearchUI() {
      const searchType = searchTypeSelect.value;
      if (searchType === "state") {
        radiusContainer.style.display = "none";
        searchTips.innerHTML =
          "Enter Malaysian states (comma-separated), e.g., <code>Selangor, Kuala Lumpur</code>.";
      } else {
        radiusContainer.style.display = "block";
        if (searchType === "area") {
          searchTips.innerHTML =
            "Enter towns/townships (comma-separated), e.g., <code>Shah Alam, Subang Jaya</code>.";
        } else {
          searchTips.innerHTML =
            "Enter 4-5 digit postcodes (comma-separated), e.g., <code>40400, 47300</code>.";
        }
      }
    }

    searchTypeSelect.addEventListener("change", updateSearchUI);
    updateSearchUI(); // Initialize on page load
  });

  function renderBoundary(boundaryPayload, color) {
    if (!boundaryLayer || !boundaryPayload || !boundaryPayload.type) {
      return null;
    }
    if (
      (boundaryPayload.type === "polygon" ||
        boundaryPayload.type === "rectangle") &&
      boundaryPayload.feature
    ) {
      const geoLayer = L.geoJSON(boundaryPayload.feature, {
        interactive: false,
        style: {
          color,
          weight: 2,
          fillColor: color,
          fillOpacity: 0.08,
        },
      }).addTo(boundaryLayer);
      return geoLayer.getBounds();
    }
    if (
      boundaryPayload.type === "circle" &&
      boundaryPayload.center &&
      boundaryPayload.radius_km
    ) {
      const circle = L.circle(
        [boundaryPayload.center.lat, boundaryPayload.center.lon],
        {
          radius: boundaryPayload.radius_km * 1000,
          color,
          weight: 2,
          fill: false,
          dashArray: "6 4",
          interactive: false,
        }
      ).addTo(boundaryLayer);
      return circle.getBounds();
    }
    return null;
  }

  async function runSearch() {
    const termInput = document.getElementById("search-term");
    const radiusInput = document.getElementById("search-radius");
    const searchTypeSelect = document.getElementById("search-type");
    const statusEl = document.getElementById("search-status");

    // Check if map and layers are initialized
    if (
      !map ||
      !customersLayer ||
      !serviceLayer ||
      !bpLayer ||
      !trafficLayer ||
      !boundaryLayer
    ) {
      statusEl.textContent = "Map is still loading. Please wait...";
      statusEl.style.color = "#dc3545"; // Red for error
      setTimeout(() => runSearch(), 500); // Retry after 500ms
      return;
    }

    const rawTermInput = termInput.value.trim();
    const searchType = searchTypeSelect.value;
    const radius = parseFloat(radiusInput.value);

    if (!rawTermInput) {
      statusEl.textContent = "Please enter a search term.";
      statusEl.style.color = "#dc3545"; // Red for error
      return;
    }

    const termList = rawTermInput
      .split(",")
      .map((t) => t.trim())
      .filter((t) => t.length > 0);
    if (termList.length === 0) {
      statusEl.textContent = "Please provide at least one search term.";
      statusEl.style.color = "#dc3545";
      return;
    }
    if (termList.length > MAX_SEARCH_TERMS) {
      statusEl.textContent = `Maximum ${MAX_SEARCH_TERMS} locations per search.`;
      statusEl.style.color = "#dc3545";
      return;
    }

    if (searchType === "state") {
      const invalidStates = termList.filter((t) => !isValidStateInput(t));
      if (invalidStates.length) {
        statusEl.textContent = `Invalid Malaysian state(s): ${invalidStates.join(
          ", "
        )}`;
        statusEl.style.color = "#dc3545";
        return;
      }
    } else if (searchType === "postcode") {
      const invalidPostcodes = termList.filter(
        (t) => !/^\d{4,5}$/.test(t.replace(/\s+/g, ""))
      );
      if (invalidPostcodes.length) {
        statusEl.textContent = `Postcodes must be 4 or 5 digits: ${invalidPostcodes.join(
          ", "
        )}`;
        statusEl.style.color = "#dc3545";
        return;
      }
    } else {
      const invalidAreas = termList.filter((t) => /^\d/.test(t));
      if (invalidAreas.length) {
        statusEl.textContent = `Area/Township names cannot start with a number: ${invalidAreas.join(
          ", "
        )}`;
        statusEl.style.color = "#dc3545";
        return;
      }
    }

    const normalizedTerm = termList.join(", ");

    // Validate radius for area/postcode searches
    if (searchType !== "state" && (!radius || radius <= 0)) {
      statusEl.textContent = "Radius must be a positive number.";
      statusEl.style.color = "#dc3545"; // Red for error
      return;
    }

    statusEl.textContent = "Searching...";
    statusEl.style.color = "#6c757d"; // Gray for loading

    try {
      // Build API URL with search type
      const params = new URLSearchParams({
        term: normalizedTerm,
        search_type: searchType,
      });

      if (searchType !== "state") {
        params.append("radius_km", radius.toString());
      }

      const url = `/api/search?${params.toString()}`;
      const resp = await fetch(url);

      if (!resp.ok) {
        let detail = "Location not found. Please try a different search term.";
        try {
          const errorData = await resp.json();
          if (errorData && errorData.detail) {
            detail = errorData.detail;
          }
        } catch (e) {}
        statusEl.textContent = detail;
        statusEl.style.color = "#dc3545"; // Red for error
        return;
      }

      const data = await resp.json();

      // Validate response data
      if (!data || !Array.isArray(data.boundaries)) {
        throw new Error("Invalid response from server");
      }

      const boundaries = data.boundaries;
      if (!boundaries.length) {
        throw new Error("No search areas returned by the server.");
      }

      // Clear all layers
      customersLayer.clearLayers();
      customerCirclesLayer.clearLayers();
      serviceLayer.clearLayers();
      bpLayer.clearLayers();
      trafficLayer.clearLayers();
      boundaryLayer.clearLayers();
      heatmapLayer = null;

      const bounds = [];

      // Create heatmap from customer data
      const customers = data.customers || [];
      if (customers.length > 0) {
        const heatmapData = {};
        customers.forEach((customer) => {
          const key = `${customer.lat.toFixed(4)},${customer.lon.toFixed(4)}`;
          if (!heatmapData[key]) {
            heatmapData[key] = {
              lat: customer.lat,
              lon: customer.lon,
              weight: 0,
            };
          }
          const weightValue = Number(customer.weight);
          const contribution = Number.isFinite(weightValue) ? weightValue : 1;
          heatmapData[key].weight += contribution;
        });

        const bucketedPoints = Object.values(heatmapData).map((point) => {
          const rawWeight = point.weight;
          const bucket =
            densityBuckets.find((bucket) => {
              if (bucket.min && rawWeight < bucket.min) return false;
              if (bucket.max && rawWeight > bucket.max) return false;
              return true;
            }) || densityBuckets[densityBuckets.length - 1];

          let intensity;
          if (!bucket.min) {
            intensity = Math.min(rawWeight, bucket.max) / bucket.max;
          } else if (!bucket.max) {
            intensity = 1 + (rawWeight - bucket.min) / bucket.min;
          } else {
            intensity = (rawWeight - bucket.min) / (bucket.max - bucket.min);
          }
          intensity = Math.min(Math.max(intensity, 0.1), 1.0);

          return {
            lat: point.lat,
            lon: point.lon,
            intensity,
            color: bucket.color,
            label: bucket.label,
            raw: rawWeight,
          };
        });

        heatmapLayer = L.heatLayer(
          bucketedPoints.map((pt) => [pt.lat, pt.lon, pt.intensity]),
          {
            radius: 25,
            blur: 15,
            maxZoom: 17,
            gradient: densityBuckets.reduce((grad, bucket, idx) => {
              grad[idx / (densityBuckets.length - 1 || 1)] = bucket.color;
              return grad;
            }, {}),
          }
        );
        customersLayer.addLayer(heatmapLayer);

        bucketedPoints.forEach((pt) => {
          const radius =
            pt.raw < 1000
              ? 8
              : pt.raw < 2000
              ? 12
              : pt.raw < 3000
              ? 16
              : pt.raw < 4000
              ? 20
              : pt.raw < 5000
              ? 24
              : 28;

          const circle = L.circleMarker([pt.lat, pt.lon], {
            radius,
            color: pt.color,
            fillColor: pt.color,
            fillOpacity: 0.7,
            weight: 2,
            opacity: 0.9,
          }).bindPopup(
            `<strong>${
              pt.label
            }</strong><br>Customers: ${pt.raw.toLocaleString()}`
          );
          circle.addTo(customerCirclesLayer);
          bounds.push([pt.lat, pt.lon]);
        });

        const dominantBucket = bucketedPoints.reduce(
          (acc, pt) => (pt.raw > acc.raw ? pt : acc),
          bucketedPoints[0]
        );
        if (dominantBucket) {
          statusEl.textContent += ` | Highest density: ${dominantBucket.label}`;
        }
      }

      // Add markers for other layers
      function addMarkers(items, layer, style) {
        if (!Array.isArray(items)) return;
        items.forEach((item) => {
          if (
            !item ||
            typeof item.lat !== "number" ||
            typeof item.lon !== "number"
          ) {
            console.warn("Invalid marker data:", item);
            return;
          }

          const latlng = [item.lat, item.lon];
          bounds.push(latlng);
          const marker = L.circleMarker(latlng, style || {});
          const props = { ...item };
          delete props.lat;
          delete props.lon;

          let popup = `<strong>${item.label || "Location"}</strong>`;
          const lines = [];
          for (const [k, v] of Object.entries(props)) {
            if (k === "label") continue;
            if (v !== null && v !== undefined && v !== "") {
              lines.push(`<b>${k}</b>: ${v}`);
            }
          }
          if (lines.length) {
            popup += "<br>" + lines.join("<br>");
          }
          marker.bindPopup(popup);
          marker.addTo(layer);
        });
      }

      addMarkers(data.service || [], serviceLayer, serviceStyle);
      addMarkers(data.bp || [], bpLayer, bpStyle);
      addMarkers(data.traffic || [], trafficLayer, trafficStyle);

      // Draw boundaries and center markers
      let mapBounds = null;
      boundaries.forEach((boundaryEntry, index) => {
        const color = getBoundaryColor(index);
        const renderedBounds = renderBoundary(boundaryEntry.boundary, color);
        if (renderedBounds) {
          if (!mapBounds) {
            mapBounds = renderedBounds;
          } else {
            mapBounds.extend(renderedBounds);
          }
        }
        if (
          boundaryEntry.center &&
          typeof boundaryEntry.center.lat === "number" &&
          typeof boundaryEntry.center.lon === "number"
        ) {
          L.circleMarker([boundaryEntry.center.lat, boundaryEntry.center.lon], {
            radius: 6,
            color,
            fillColor: "#ffffff",
            fillOpacity: 1,
            weight: 2,
          })
            .bindPopup(
              `<strong>${
                boundaryEntry.display_name || boundaryEntry.term
              }</strong>`
            )
            .addTo(boundaryLayer);
          bounds.push([boundaryEntry.center.lat, boundaryEntry.center.lon]);
        }
      });

      // Fallback bounds if no boundary from API
      if (!mapBounds) {
        if (bounds.length > 0) {
          mapBounds = L.latLngBounds(bounds);
        }
      }

      // Fit map to bounds
      if (mapBounds) {
        try {
          map.fitBounds(mapBounds, { padding: [20, 20] });
          setTimeout(() => {
            map.invalidateSize();
          }, 100);
        } catch (e) {
          console.warn("Error fitting bounds:", e);
        }
      } else if (bounds.length > 0) {
        map.setView(bounds[0], 12);
      } else if (boundaries[0]?.center) {
        map.setView([boundaries[0].center.lat, boundaries[0].center.lon], 12);
      } else {
        map.setView([4.5, 109.0], 6);
      }

      // Count total results
      const totalResults =
        (data.customers?.length || 0) +
        (data.service?.length || 0) +
        (data.bp?.length || 0) +
        (data.traffic?.length || 0);

      // Build status message
      let statusMsg;
      if (totalResults > 0) {
        statusMsg = `Found ${totalResults} result(s) across ${boundaries.length} location(s).`;
        if (searchType !== "state" && data.radius_km) {
          statusMsg += ` (radius ${data.radius_km} km)`;
        }
      } else {
        statusMsg = `No results found across ${boundaries.length} location(s).`;
        if (searchType !== "state" && data.radius_km) {
          statusMsg += ` Try increasing the radius (currently ${data.radius_km} km).`;
        }
      }
      const failedTerms = Array.isArray(data.failed_terms)
        ? data.failed_terms
        : [];
      if (failedTerms.length) {
        const failedList = failedTerms
          .map((ft) => (ft.reason ? `${ft.term} (${ft.reason})` : ft.term))
          .join(", ");
        statusMsg += ` | ${failedTerms.length} location(s) not found: ${failedList}`;
      }

      statusEl.textContent = statusMsg;
      statusEl.style.color = "#28a745"; // Green for success
    } catch (err) {
      console.error("Search error:", err);
      statusEl.textContent = `Error: ${
        err.message || "Error contacting server. Please try again."
      }`;
      statusEl.style.color = "#dc3545"; // Red for error
    }
  }

  document
    .getElementById("search-btn")
    .addEventListener("click", () => runSearch());

  document.getElementById("clear-btn").addEventListener("click", () => {
    const termInput = document.getElementById("search-term");
    const radiusInput = document.getElementById("search-radius");
    const statusEl = document.getElementById("search-status");

    termInput.value = "";
    radiusInput.value = "10";
    statusEl.textContent = "";
    statusEl.style.color = ""; // Reset color

    // Remove heatmap if it exists
    if (heatmapLayer) {
      map.removeLayer(heatmapLayer);
      heatmapLayer = null;
    }

    customersLayer.clearLayers();
    serviceLayer.clearLayers();
    bpLayer.clearLayers();
    trafficLayer.clearLayers();
    boundaryLayer.clearLayers();

    map.setView([4.5, 109.0], 6);
    // Force resize on mobile
    setTimeout(() => {
      map.invalidateSize();
    }, 100);
  });

  document.getElementById("search-term").addEventListener("keyup", (e) => {
    if (e.key === "Enter") {
      runSearch();
    }
  });

  // Handle window resize and orientation change for mobile
  window.addEventListener("resize", () => {
    setTimeout(() => {
      map.invalidateSize();
    }, 100);
  });

  window.addEventListener("orientationchange", () => {
    setTimeout(() => {
      map.invalidateSize();
    }, 200);
  });
</script>
{% endblock %}

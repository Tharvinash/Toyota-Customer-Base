{% extends "base.html" %} {% block title %}Interactive Map{% endblock %} {%
block content %}
<style>
  .navbar {
    margin-bottom: 1.25rem !important;
  }
  #map-container {
    position: relative;
    height: 70vh;
    min-height: 420px;
    border-radius: 8px;
    overflow: hidden;
    background: #f8f9fa;
  }
  #map {
    height: 100%;
    width: 100%;
  }
  #map-legend {
    position: absolute;
    right: 12px;
    bottom: 16px;
    z-index: 5;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid #999;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    min-width: 230px;
    max-width: calc(100% - 24px);
    pointer-events: auto;
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0;
    position: relative;
  }
  .legend-pin {
    width: 18px;
    height: 26px;
    display: inline-block;
  }
  .legend-tooltip {
    position: absolute;
    left: 28px;
    top: 50%;
    transform: translateY(-50%);
    background: #111;
    color: #fff;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 12px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .legend-row:hover .legend-tooltip {
    opacity: 0.95;
  }
  @media (max-width: 768px) {
    main.container {
      padding-left: 0 !important;
      padding-right: 0 !important;
      max-width: 100% !important;
    }
    #map-container {
      height: calc(100vh - 180px);
      min-height: 320px;
      border-radius: 0;
    }
    #map-legend {
      font-size: 12px;
      padding: 8px 10px;
      min-width: 190px;
      right: 8px;
      bottom: 10px;
    }
  }
</style>

<div class="row mb-3">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
          <select
            id="filter-state"
            class="form-select me-2"
            style="min-width: 200px"
          >
            <option value="">-- All States --</option>
          </select>
          <select
            id="filter-city"
            class="form-select me-2"
            style="min-width: 200px"
            disabled
          >
            <option value="">-- All Cities --</option>
          </select>
          <select
            id="filter-postcode"
            class="form-select me-2"
            style="min-width: 180px"
            disabled
          >
            <option value="">-- All Postcodes --</option>
          </select>
          <button id="filter-search-btn" class="btn btn-primary me-2">
            Search
          </button>
          <button id="filter-clear-btn" class="btn btn-outline-secondary me-2">
            Clear
          </button>
          <span id="filter-search-status" class="text-muted small"></span>
        </div>
        <div
          class="tips-ui"
          style="
            font-size: 12px;
            color: #6c757d;
            padding: 8px;
            background-color: #f8f9fa;
            border-radius: 4px;
            margin-top: 8px;
          "
        >
          <strong>Filter:</strong>
          <span id="filter-tips"
            >Select a State, then City/Postcode to narrow the results. If City
            or Postcode is not selected, all data for the selected State/City
            will be shown.</span
          >
        </div>
      </div>
    </div>
  </div>
</div>

<div id="map-container">
  <div id="map"></div>
  <div id="map-legend">
    <div style="font-weight: 600; margin-bottom: 6px">Legend</div>
    <div id="legend-layers" style="line-height: 1.4; margin-bottom: 8px"></div>
    <hr style="margin: 8px 0" />
    <div style="font-weight: 600; margin-bottom: 4px">Customer Density</div>
    <div id="density-legend-ranges" style="line-height: 1.4"></div>
  </div>
</div>

<script>
  const densityBuckets = [
    { max: 1000, label: "< 1,000", color: "#2b83ba" },
    { min: 1001, max: 2000, label: "1,001 – 2,000", color: "#80bfab" },
    { min: 2001, max: 3000, label: "2,001 – 3,000", color: "#ffffbf" },
    { min: 3001, max: 4000, label: "3,001 – 4,000", color: "#fdae61" },
    { min: 4001, max: 5000, label: "4,001 – 5,000", color: "#f46d43" },
    { min: 5001, label: "> 5,000", color: "#d7191c" },
  ];

  function renderDensityLegend() {
    const legendContainer = document.getElementById("density-legend-ranges");
    if (!legendContainer) return;
    legendContainer.innerHTML = densityBuckets
      .map(
        (bucket) => `
        <div style="display:flex;align-items:center;margin:2px 0;">
          <span style="
            display:inline-block;
            width:18px;
            height:12px;
            border:1px solid #666;
            margin-right:8px;
            background:${bucket.color};
          "></span>
          <span style="font-size:12px;">${bucket.label}</span>
        </div>
      `
      )
      .join("");
  }

  function renderLayerLegend() {
    const legend = document.getElementById("legend-layers");
    if (!legend) return;
    const pinSvg = (color) => `
      <svg class="legend-pin" viewBox="0 0 24 36" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0C5.926 0 1 4.79 1 10.7c0 7.1 8 15.3 10.5 17.8.3.3.7.3 1 0C15 26 23 17.8 23 10.7 23 4.79 18.074 0 12 0Z" fill="${color}" stroke="#b3261e" stroke-width="0.6"/>
        <circle cx="12" cy="10.5" r="4" fill="#7a0c0c" opacity="0.85"/>
      </svg>`;
    legend.innerHTML = `
      <div class="legend-row">
        ${pinSvg("#0d6efd")}
        <span>Toyota Service Outlets</span>
        <span class="legend-tooltip">Click markers to view outlet details.</span>
      </div>
      <div class="legend-row">
        ${pinSvg("#28a745")}
        <span>Toyota Body &amp; Paint</span>
        <span class="legend-tooltip">Body &amp; Paint outlet locations.</span>
      </div>
      <div class="legend-row">
        ${pinSvg("#dc3545")}
        <span>Traffic Police Stations</span>
        <span class="legend-tooltip">Traffic police station locations.</span>
      </div>
      <div class="legend-row">
        <span style="width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#ffcf33,#f46d43,#d7191c);display:inline-block;"></span>
        <span>Customer Density (Heatmap)</span>
        <span class="legend-tooltip">Heat shows customer concentration by weight.</span>
      </div>
    `;
  }
</script>

<script>
  let masterData = null;
  let map;
  let mapReadyPromise;
  let resolveMapReady;
  let mapIdleSeen = false;
  let heatmap;
  let infoWindow;
  let geocoder;
  let boundaryOverlay = null;
  let activePlaceId = null;
  let activeFeatureLayer = null;

  const pinIcon = (color) => {
    const svg = `
      <svg width="36" height="54" viewBox="0 0 24 36" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0C5.926 0 1 4.79 1 10.7c0 7.1 8 15.3 10.5 17.8.3.3.7.3 1 0C15 26 23 17.8 23 10.7 23 4.79 18.074 0 12 0Z" fill="${color}" stroke="#b3261e" stroke-width="0.6"/>
        <circle cx="12" cy="10.5" r="4" fill="#7a0c0c" opacity="0.85"/>
      </svg>`;
    return {
      url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
      scaledSize: new google.maps.Size(24, 36),
      anchor: new google.maps.Point(12, 34),
    };
  };

  const overlays = {
    service: [],
    bp: [],
    traffic: [],
  };

  const layerVisibility = {
    heatmap: true,
    service: true,
    bp: true,
    traffic: true,
  };

  function clearOverlays() {
    ["service", "bp", "traffic"].forEach((key) => {
      overlays[key].forEach((item) => item.setMap(null));
      overlays[key] = [];
    });
    if (heatmap) {
      heatmap.setMap(null);
      heatmap = null;
    }
  }

  async function loadMasterData() {
    try {
      const response = await fetch("/api/master-data");
      if (!response.ok) throw new Error("Failed to load master data");
      masterData = await response.json();
      populateStateDropdown();
    } catch (error) {
      console.error("Error loading master data:", error);
      const statusEl = document.getElementById("filter-search-status");
      if (statusEl) {
        statusEl.textContent = "Error loading filter data";
        statusEl.style.color = "#dc3545";
      }
    }
  }

  function populateStateDropdown() {
    if (!masterData || !masterData.states) return;
    const stateSelect = document.getElementById("filter-state");
    if (!stateSelect) return;
    stateSelect.innerHTML = '<option value="">-- All States --</option>';
    masterData.states.forEach((state) => {
      const option = document.createElement("option");
      option.value = state.name;
      option.textContent = state.name;
      stateSelect.appendChild(option);
    });
    stateSelect.disabled = false;
    stateSelect.addEventListener("change", handleStateChange);
  }

  function handleStateChange() {
    const stateSelect = document.getElementById("filter-state");
    const citySelect = document.getElementById("filter-city");
    const postcodeSelect = document.getElementById("filter-postcode");
    if (!stateSelect || !citySelect || !postcodeSelect || !masterData) return;

    citySelect.innerHTML = '<option value="">-- All Cities --</option>';
    postcodeSelect.innerHTML = '<option value="">-- All Postcodes --</option>';

    if (!stateSelect.value) {
      citySelect.disabled = true;
      postcodeSelect.disabled = true;
      return;
    }

    const stateData = masterData.states.find(
      (s) => s.name === stateSelect.value
    );
    if (!stateData || !stateData.cities) {
      citySelect.disabled = true;
      postcodeSelect.disabled = true;
      return;
    }

    citySelect.disabled = false;
    stateData.cities.forEach((city) => {
      const option = document.createElement("option");
      option.value = city.name;
      option.textContent = city.name;
      citySelect.appendChild(option);
    });

    citySelect.addEventListener("change", handleCityChange);
    postcodeSelect.disabled = true;
  }

  function handleCityChange() {
    const stateSelect = document.getElementById("filter-state");
    const citySelect = document.getElementById("filter-city");
    const postcodeSelect = document.getElementById("filter-postcode");
    if (!stateSelect || !citySelect || !postcodeSelect || !masterData) return;

    postcodeSelect.innerHTML = '<option value="">-- All Postcodes --</option>';

    if (!stateSelect.value || !citySelect.value) {
      postcodeSelect.disabled = true;
      return;
    }

    const stateData = masterData.states.find(
      (s) => s.name === stateSelect.value
    );
    const cityData = stateData?.cities?.find(
      (c) => c.name === citySelect.value
    );
    if (!cityData || !cityData.postcodes?.length) {
      postcodeSelect.disabled = true;
      return;
    }

    postcodeSelect.disabled = false;
    cityData.postcodes.forEach((postcode) => {
      const option = document.createElement("option");
      option.value = postcode;
      option.textContent = postcode;
      postcodeSelect.appendChild(option);
    });
  }

  function aggregateCustomers(customers) {
    const aggregated = {};
    customers.forEach((customer) => {
      if (typeof customer.lat !== "number" || typeof customer.lon !== "number")
        return;
      const key = `${customer.lat.toFixed(4)},${customer.lon.toFixed(4)}`;
      const weightValue = Number(customer.weight);
      const contribution = Number.isFinite(weightValue) ? weightValue : 1;
      if (!aggregated[key]) {
        aggregated[key] = { lat: customer.lat, lon: customer.lon, weight: 0 };
      }
      aggregated[key].weight += contribution;
    });
    return Object.values(aggregated).map((point) => {
      const rawWeight = point.weight;
      const bucket =
        densityBuckets.find((bucket) => {
          if (bucket.min && rawWeight < bucket.min) return false;
          if (bucket.max && rawWeight > bucket.max) return false;
          return true;
        }) || densityBuckets[densityBuckets.length - 1];
      return {
        ...point,
        raw: rawWeight,
        color: bucket.color,
        label: bucket.label,
      };
    });
  }

  function addMarkers(
    items,
    collection,
    color,
    defaultLabel,
    bounds,
    visibilityKey
  ) {
    if (!Array.isArray(items) || !map) return;
    items.forEach((item) => {
      if (typeof item.lat !== "number" || typeof item.lon !== "number") return;
      const position = new google.maps.LatLng(item.lat, item.lon);
      if (bounds) bounds.extend(position);

      const marker = new google.maps.Marker({
        position,
        map,
        icon: pinIcon(color),
        title: item.label || defaultLabel,
      });

      const props = { ...item };
      delete props.lat;
      delete props.lon;

      const lines = [];
      for (const [k, v] of Object.entries(props)) {
        if (k === "label") continue;
        if (v !== null && v !== undefined && v !== "") {
          lines.push(`<b>${k}</b>: ${v}`);
        }
      }
      let popup = `<div><strong>${item.label || defaultLabel}</strong>`;
      if (lines.length) popup += "<br>" + lines.join("<br>");
      popup += "</div>";

      marker.addListener("click", () => {
        infoWindow.setContent(popup);
        infoWindow.open({ anchor: marker, map, shouldFocus: false });
      });
      marker.setMap(layerVisibility[visibilityKey] ? map : null);
      collection.push(marker);
    });
  }

  function renderFilteredData(data, options = {}) {
    clearOverlays();
    const bounds = options.bounds || null;

    const customers = Array.isArray(data.customers) ? data.customers : [];
    if (customers.length > 0) {
      const bucketedPoints = aggregateCustomers(customers);
      const heatPoints = bucketedPoints.map((pt) => ({
        location: new google.maps.LatLng(pt.lat, pt.lon),
        weight: Math.max(pt.raw, 1),
      }));

      heatmap = new google.maps.visualization.HeatmapLayer({
        data: heatPoints,
        map,
        dissipating: true,
        radius: 32,
        opacity: 0.65,
        gradient: ["rgba(0,0,0,0)", ...densityBuckets.map((b) => b.color)],
      });

      bucketedPoints.forEach((pt) => {
        if (bounds) bounds.extend(new google.maps.LatLng(pt.lat, pt.lon));
      });
      heatmap.setMap(layerVisibility.heatmap ? map : null);
    }

    addMarkers(
      data.service || [],
      overlays.service,
      "#0d6efd",
      "Toyota Service Outlet",
      bounds,
      "service"
    );
    addMarkers(
      data.bp || [],
      overlays.bp,
      "#28a745",
      "Toyota Body & Paint",
      bounds,
      "bp"
    );
    addMarkers(
      data.traffic || [],
      overlays.traffic,
      "#dc3545",
      "Traffic Police Station",
      bounds,
      "traffic"
    );

    applyLayerVisibility();
  }

  async function runFilterSearch() {
    const stateSelect = document.getElementById("filter-state");
    const citySelect = document.getElementById("filter-city");
    const postcodeSelect = document.getElementById("filter-postcode");
    const statusEl = document.getElementById("filter-search-status");
    if (!stateSelect || !citySelect || !postcodeSelect || !statusEl) return;

    const state = stateSelect.value;
    const city = citySelect.value;
    const postcode = postcodeSelect.value;

    if (!state) {
      statusEl.textContent = "Please select a State.";
      statusEl.style.color = "#dc3545";
      return;
    }

    statusEl.textContent = "Searching...";
    statusEl.style.color = "#6c757d";

    try {
      if (mapReadyPromise) {
        await mapReadyPromise;
      }
      const queryParts = [];
      if (postcode) queryParts.push(postcode);
      if (city) queryParts.push(city);
      if (state) queryParts.push(state);
      queryParts.push("Malaysia");
      const addressQuery = queryParts.join(", ");

      const geoResult = await geocodeSelection(addressQuery);
      if (!geoResult || !geoResult.geometry) {
        statusEl.textContent =
          "Could not locate that area. Please try a different selection.";
        statusEl.style.color = "#dc3545";
        return;
      }

      const boundaryBounds = focusMapToSearchResult(geoResult);

      const params = new URLSearchParams({ state });
      if (city) params.append("city", city);
      if (postcode) params.append("postcode", postcode);

      const resp = await fetch(`/api/search-filtered?${params.toString()}`);
      if (!resp.ok) {
        const errorData = await resp.json();
        statusEl.textContent = errorData.detail || "Error searching data";
        statusEl.style.color = "#dc3545";
        clearBoundary();
        return;
      }

      const data = await resp.json();
      renderFilteredData(data, { bounds: boundaryBounds });

      const totalResults =
        (data.customers?.length || 0) +
        (data.service?.length || 0) +
        (data.bp?.length || 0) +
        (data.traffic?.length || 0);
      statusEl.textContent = `Found ${totalResults} result(s)${
        city ? ` in ${city}` : ""
      }${postcode ? `, postcode ${postcode}` : ""}`;
      statusEl.style.color = "#28a745";
    } catch (err) {
      console.error("Filter search error:", err);
      statusEl.textContent = `Error: ${
        err.message || "Error contacting server"
      }`;
      statusEl.style.color = "#dc3545";
      clearBoundary();
    }
  }

  function clearFilter() {
    const stateSelect = document.getElementById("filter-state");
    const citySelect = document.getElementById("filter-city");
    const postcodeSelect = document.getElementById("filter-postcode");
    const statusEl = document.getElementById("filter-search-status");
    if (!stateSelect || !citySelect || !postcodeSelect || !statusEl) return;

    stateSelect.value = "";
    citySelect.innerHTML = '<option value="">-- All Cities --</option>';
    citySelect.disabled = true;
    postcodeSelect.innerHTML = '<option value="">-- All Postcodes --</option>';
    postcodeSelect.disabled = true;
    statusEl.textContent = "";

    clearOverlays();
    map.setCenter({ lat: 4.5, lng: 109.0 });
    map.setZoom(6);
  }

  function initMap() {
    renderDensityLegend();
    renderLayerLegend();

    mapReadyPromise = new Promise((resolve) => {
      resolveMapReady = resolve;
    });

    map = new google.maps.Map(document.getElementById("map"), {
      center: { lat: 4.5, lng: 109.0 },
      zoom: 6,
      mapTypeControl: true,
      streetViewControl: false,
      fullscreenControl: true,
      mapId: "{{ google_maps_map_id or '168556c0ee5090f059518c3e' }}",
      restriction: {
        latLngBounds: {
          north: 7.5,
          south: 0.85,
          west: 99.5,
          east: 119.5,
        },
        strictBounds: false,
      },
    });

    infoWindow = new google.maps.InfoWindow();
    geocoder = new google.maps.Geocoder();
    loadMasterData();
    createLayerToggleControl();

    google.maps.event.addListenerOnce(map, "idle", () => {
      mapIdleSeen = true;
      if (resolveMapReady) resolveMapReady();
    });

    document
      .getElementById("filter-search-btn")
      .addEventListener("click", runFilterSearch);
    document
      .getElementById("filter-clear-btn")
      .addEventListener("click", clearFilter);

    window.addEventListener("resize", () => {
      google.maps.event.trigger(map, "resize");
    });
  }

  window.initMap = initMap;

  function applyLayerVisibility() {
    if (heatmap) {
      heatmap.setMap(layerVisibility.heatmap ? map : null);
    }
    overlays.service.forEach((m) =>
      m.setMap(layerVisibility.service ? map : null)
    );
    overlays.bp.forEach((m) => m.setMap(layerVisibility.bp ? map : null));
    overlays.traffic.forEach((m) =>
      m.setMap(layerVisibility.traffic ? map : null)
    );
  }

  function createLayerToggleControl() {
    const controlDiv = document.createElement("div");
    controlDiv.style.background = "#fff";
    controlDiv.style.border = "1px solid #ccc";
    controlDiv.style.borderRadius = "8px";
    controlDiv.style.boxShadow = "0 2px 6px rgba(0,0,0,0.15)";
    controlDiv.style.padding = "10px 12px";
    controlDiv.style.fontSize = "13px";
    controlDiv.style.margin = "10px";
    controlDiv.style.minWidth = "180px";

    controlDiv.innerHTML = `
      <div style="font-weight:600;margin-bottom:6px;">Layers</div>
      <label style="display:flex;align-items:center;gap:6px;margin:4px 0;">
        <input type="checkbox" id="toggle-heatmap" checked /> Customer Density (Heatmap)
      </label>
      <label style="display:flex;align-items:center;gap:6px;margin:4px 0;">
        <input type="checkbox" id="toggle-service" checked /> Toyota Service Outlets
      </label>
      <label style="display:flex;align-items:center;gap:6px;margin:4px 0;">
        <input type="checkbox" id="toggle-bp" checked /> Toyota Body & Paint
      </label>
      <label style="display:flex;align-items:center;gap:6px;margin:4px 0;">
        <input type="checkbox" id="toggle-traffic" checked /> Traffic Police Stations
      </label>
    `;

    const controlIndex = google.maps.ControlPosition.TOP_LEFT;
    map.controls[controlIndex].push(controlDiv);

    const bindings = [
      { id: "toggle-heatmap", key: "heatmap" },
      { id: "toggle-service", key: "service" },
      { id: "toggle-bp", key: "bp" },
      { id: "toggle-traffic", key: "traffic" },
    ];

    bindings.forEach(({ id, key }) => {
      const el = controlDiv.querySelector(`#${id}`);
      if (!el) return;
      el.addEventListener("change", (e) => {
        layerVisibility[key] = e.target.checked;
        applyLayerVisibility();
      });
    });
  }

  function clearBoundary() {
    if (boundaryOverlay) {
      boundaryOverlay.setMap(null);
      boundaryOverlay = null;
    }
    if (activeFeatureLayer) {
      activeFeatureLayer.style = null;
      activeFeatureLayer = null;
    }
    activePlaceId = null;
  }

  function getCoord(val, accessor) {
    if (!val) return null;
    if (typeof val[accessor] === "function") return val[accessor]();
    if (typeof val[accessor] === "number") return val[accessor];
    return null;
  }

  function toBoundsLiteral(boundsLike) {
    if (!boundsLike) return null;
    const sw = boundsLike.getSouthWest
      ? boundsLike.getSouthWest()
      : boundsLike.southwest;
    const ne = boundsLike.getNorthEast
      ? boundsLike.getNorthEast()
      : boundsLike.northeast;
    if (!sw || !ne) return null;
    const swLat = getCoord(sw, "lat");
    const swLng = getCoord(sw, "lng");
    const neLat = getCoord(ne, "lat");
    const neLng = getCoord(ne, "lng");
    if ([swLat, swLng, neLat, neLng].some((v) => typeof v !== "number"))
      return null;
    return {
      southwest: { lat: swLat, lng: swLng },
      northeast: { lat: neLat, lng: neLng },
    };
  }

  function focusMapToSearchResult(geocodeResult) {
    if (!map || !geocodeResult || !geocodeResult.geometry) return null;
    clearBoundary();

    const geom = geocodeResult.geometry;
    const viewport = geom.viewport;
    const boundsLiteral = toBoundsLiteral(geom.bounds || viewport);
    if (!boundsLiteral) return null;

    const rectBounds = new google.maps.LatLngBounds(
      new google.maps.LatLng(
        boundsLiteral.southwest.lat,
        boundsLiteral.southwest.lng
      ),
      new google.maps.LatLng(
        boundsLiteral.northeast.lat,
        boundsLiteral.northeast.lng
      )
    );

    boundaryOverlay = new google.maps.Rectangle({
      bounds: rectBounds,
      strokeColor: "#2563eb",
      strokeOpacity: 1,
      strokeWeight: 2,
      fillColor: "#2563eb",
      fillOpacity: 0.08,
      clickable: false,
    });
    boundaryOverlay.setMap(map);

    const placeId = geocodeResult.place_id;
    const featureType = inferFeatureType(geocodeResult.types || []);
    if (placeId && featureType) {
      const layer = map.getFeatureLayer(featureType);
      layer.style = ({ feature }) => {
        const isTarget = feature.placeId === placeId;
        return {
          strokeColor: "#2563eb",
          strokeOpacity: isTarget ? 1 : 0,
          strokeWeight: isTarget ? 2 : 0,
          fillColor: "#2563eb",
          fillOpacity: isTarget ? 0.08 : 0,
        };
      };
      activeFeatureLayer = layer;
      activePlaceId = placeId;
    }

    map.fitBounds(rectBounds);
    google.maps.event.addListenerOnce(map, "idle", () => {
      if (map.getZoom() > 12) {
        map.setZoom(12);
      }
      const centerNow = map.getCenter();
      const containsCenter =
        centerNow && rectBounds.contains
          ? rectBounds.contains(centerNow)
          : null;
      if (containsCenter === false) {
        map.fitBounds(rectBounds);
      }
    });

    return rectBounds;
  }

  async function geocodeSelection(query) {
    if (!geocoder || !query) return null;
    return new Promise((resolve) => {
      geocoder.geocode(
        {
          address: query,
          componentRestrictions: { country: "MY" },
        },
        (results, status) => {
          if (status === "OK" && results && results.length > 0) {
            resolve(results[0]);
          } else {
            resolve(null);
          }
        }
      );
    });
  }

  function inferFeatureType(types) {
    if (!Array.isArray(types)) return null;
    if (types.includes("administrative_area_level_1"))
      return google.maps.FeatureType.ADMINISTRATIVE_AREA_LEVEL_1;
    if (types.includes("administrative_area_level_2"))
      return google.maps.FeatureType.ADMINISTRATIVE_AREA_LEVEL_2;
    if (types.includes("locality") || types.includes("political"))
      return google.maps.FeatureType.LOCALITY;
    if (types.includes("postal_code"))
      return google.maps.FeatureType.POSTAL_CODE;
    return null;
  }
</script>

></script>

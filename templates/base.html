<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Selangor Map Admin{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="64x64" href="/static/toyota-favicon.png?v=4" />
    <link rel="icon" type="image/svg+xml" href="/static/toyota-favicon.svg?v=4" />
    <link rel="shortcut icon" href="/favicon.ico?v=4" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Selangor Map Admin</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="/admin/service-outlets">Service Outlets</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/admin/bp-outlets">Body &amp; Paint</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/admin/non-dealer-workshops">Non-Dealer Workshops</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/admin/competitor-bp">Competitor B&amp;P</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/admin/traffic-stations">Traffic Stations</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/admin/customers/upload">Customer CSV</a>
            </li>
          </ul>
          <div class="d-flex gap-2 flex-wrap">
            <a class="btn btn-primary btn-sm" href="/interactive-map">Interactive Map</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="{% block main_class %}container{% endblock %}">
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
  </html>

{% extends "base.html" %}

{% block title %}Edit Body &amp; Paint Outlet{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h2 class="mb-3">Edit Body &amp; Paint Outlet</h2>
    <form method="post">
      <div class="mb-2">
        <label class="form-label">Outlet Name</label>
        <input
          name="outlet_name"
          class="form-control"
          value="{{ outlet.outlet_name or '' }}"
          required
        />
      </div>
      <div class="row">
        <div class="col-md-4 mb-2">
          <label class="form-label">City</label>
          <input name="city" class="form-control" value="{{ outlet.city or '' }}" />
        </div>
        <div class="col-md-4 mb-2">
          <label class="form-label">State</label>
          <input name="state" class="form-control" value="{{ outlet.state or '' }}" />
        </div>
        <div class="col-md-4 mb-2">
          <label class="form-label">Postcode</label>
          <input
            name="postcode"
            class="form-control"
            value="{{ outlet.postcode or '' }}"
          />
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-2">
          <label class="form-label">Latitude</label>
          <input
            name="lat"
            type="number"
            step="0.000001"
            class="form-control"
            value="{{ outlet.lat or '' }}"
          />
        </div>
        <div class="col-md-6 mb-2">
          <label class="form-label">Longitude</label>
          <input
            name="lon"
            type="number"
            step="0.000001"
            class="form-control"
            value="{{ outlet.lon or '' }}"
          />
        </div>
      </div>
      <div class="d-flex gap-2 mt-3">
        <a class="btn btn-link" href="/admin/bp-outlets">Cancel</a>
        <button class="btn btn-primary" type="submit">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
